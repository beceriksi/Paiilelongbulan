name: GemBot Pro Runner

on:
  # Her saat başı otomatik çalıştır
  schedule:
    - cron: '0 * * * *'
  # Manuel olarak başlatabilmek için (Test etmek için çok kullanışlıdır)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-state: '3.12'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır (Sınırlandırılmış Döngü)
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # GitHub Actions arka planda sonsuza kadar çalışamaz (max 6 saat sınırı vardır).
      # Bu yüzden botu 15 dakika boyunca çalıştırıp kapatacak şekilde tetikliyoruz.
      run: |
        timeout 900 python main.py || echo "Süre doldu, sonraki döngüde görüşmek üzere."
