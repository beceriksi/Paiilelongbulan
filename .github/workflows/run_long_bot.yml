name: Crypto Swing Long Scanner Bot

on:
  schedule:
    # Her 1 saatte bir otomatik çalışır (0. dakikalarda)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub panelinden "Run workflow" butonuyla elle tetiklemek için

jobs:
  run-long-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Kütüphanelerin hızlı yüklenmesi için önbellek kullanır

    - name: Gerekli Kütüphaneleri Kur
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright Sistem Bağımlılıklarını ve Tarayıcıyı Kur
      run: |
        # TradingView'den 1H grafik çekebilmek için sanal tarayıcıyı ayağa kaldırır
        playwright install chromium --with-deps

    - name: Swing Long Botunu Çalıştır
      env:
        TELEGRAM_LONG_TOKEN: ${{ secrets.TELEGRAM_LONG_TOKEN }}
        TELEGRAM_LONG_CHAT_ID: ${{ secrets.TELEGRAM_LONG_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main_long.py
